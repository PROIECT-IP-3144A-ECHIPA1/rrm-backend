services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rrm
      POSTGRES_USER: rrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rrm_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rrm_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrm -d rrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rrm:${POSTGRES_PASSWORD:-rrm_dev}@db:5432/rrm
      CORS_ORIGINS: http://localhost:3000
      GOOGLE_CLIENT_ID: 57335626323-6lac5g6c3r0d029midppknls33lv0hmi.apps.googleusercontent.com
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-do-not-deploy}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  rrm_data:
